<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <title>gb_hw1</title>
  </head>
  <body>
    <!-- Header -->
    <section class="header">
      <div class="logo">
        <img src="img/logo.svg" alt="logo" />
        <p class="logo_text">Grow<span>BE</span></p>
      </div>
      <div class="nav">
        <a class="nav__link--active" href="">Home</a>
        <a class="nav__link" href="#">About US</a>
        <a class="nav__link" href="#">Services</a>
        <a class="nav__link" href="#">Features</a>
        <a class="nav__link" href="#">Team</a>
        <a class="nav__link" href="#">Blog</a>
        <a class="nav__link" href="#">Contact</a>
      </div>
    </section>
    <!-- Главный экран -->
    <section class="top">
      <div class="top__info">
        <div class="top__info_text">
          <h1 class="top__info_h1">
            SEO & Digital Marketing For Your Website.
          </h1>
          <p class="top__info_p">
            Provide all kind of seo services and help to improve seo ranking.
            Globally incubate standards.
          </p>
        </div>
        <div class="top__info_buttons">
          <button class="top__info_button">Start Now</button>
          <a class="top__info_link" href="#">Watch video</a>
        </div>
        <img class="top__info_img" src="img/top.svg" alt="top_img" />
      </div>
    </section>
    <!-- Логотипы -->
    <section class="logos">
      <div class="logos__box">
        <img src="img/logo1.svg" alt="logo1" />
        <img src="img/logo2.svg" alt="logo2" />
        <img src="img/logo3.svg" alt="logo3" />
        <img src="img/logo4.svg" alt="logo4" />
        <img src="img/logo5.svg" alt="logo5" />
        <img src="img/logo6.svg" alt="logo6" />
      </div>
    </section>
  </body>
</html>
